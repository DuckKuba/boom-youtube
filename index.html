<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #020208;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
        }

        /* Space Nebula Background */
        .bg-space {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.15) 0%, rgba(10, 5, 20, 0.8) 50%, #020208 100%);
            z-index: 1;
        }

        /* Animated Stars Field */
        .stars-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 2;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: moveStar linear infinite, twinkle ease-in-out infinite alternate;
        }

        @keyframes moveStar {
            from { transform: translateY(0px); }
            to { transform: translateY(100vh); }
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; box-shadow: 0 0 6px #fff; }
        }

        /* Compact Cyber Card */
        .cyber-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 18, 0.92);
            border: 2px solid #ff0055;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
            width: 230px;
            backdrop-filter: blur(5px);
        }

        .header-title {
            font-size: 9px;
            letter-spacing: 1.2px;
            color: #ff3366;
            margin-bottom: 4px;
            font-weight: bold;
        }

        /* Ultra Compact Audio Controls */
        .audio-controls {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 5px;
            border-radius: 6px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            z-index: 20;
        }

        .mute-btn {
            cursor: pointer;
            font-size: 9px;
            background: none;
            border: none;
            color: #fff;
            outline: none;
        }

        .volume-slider {
            width: 35px;
            height: 3px;
            accent-color: #ff0055;
            cursor: pointer;
        }

        .stage-area {
            position: relative;
            width: 100%;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #launchBtn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055 0%, #660022 100%);
            color: #fff;
            font-weight: 900;
            font-size: 10px;
            border: 2px solid #ff6699;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
            z-index: 2;
        }

        #launchBtn:hover { transform: scale(1.05); }

        #rocketElement {
            position: absolute;
            font-size: 30px;
            display: none;
            z-index: 10;
        }

        .rocket-launch {
            display: block !important;
            animation: flyUp 1.8s ease-in forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            20% { transform: translateY(10px) scale(1.1); }
            100% { transform: translateY(-350px) scale(0.4); opacity: 0; }
        }

        #parachuteBadge {
            position: absolute;
            top: -200px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 8;
        }

        .parachute-drop {
            display: flex !important;
            animation: dropDown 1.2s ease-out forwards;
        }

        @keyframes dropDown {
            0% { top: -100px; transform: scale(0.5); }
            100% { top: 2px; transform: scale(1); }
        }

        .logo-box {
            width: 32px; height: 32px;
            background: #111;
            border: 2px solid #ff3366;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px #ff0055;
        }

        .logo-box img { width: 18px; height: 18px; object-fit: contain; }

        .url-section {
            width: 100%;
            margin-top: 6px;
            background: rgba(0,0,0,0.6);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        .url-label {
            font-size: 7.5px;
            color: #aaa;
            margin-bottom: 2px;
            display: block;
        }

        .url-box {
            display: flex;
            gap: 4px;
        }

        .url-input {
            flex: 1;
            background: #000;
            border: 1px solid #ff0055;
            border-radius: 4px;
            color: #00ff88;
            font-size: 9px;
            padding: 3px;
            outline: none;
        }

        .url-btn {
            background: #ff0055;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 8px;
            padding: 0 6px;
            cursor: pointer;
        }

        .status-bar {
            margin-top: 4px;
            font-size: 8.5px;
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-space"></div>
    <div class="stars-container" id="starsContainer"></div>

    <div class="cyber-card">
        <div class="audio-controls">
            <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
        </div>

        <div class="header-title">// BOOM CONTROL //</div>

        <div class="stage-area">
            <button id="launchBtn" onclick="launchSequence()">BOOM</button>
            <div id="rocketElement">🚀</div>

            <div id="parachuteBadge">
                <span style="font-size:15px;">🪂</span>
                <div class="logo-box">
                    <img id="targetFavicon" src="" alt="Target">
                </div>
            </div>
        </div>

        <div class="url-section">
            <span class="url-label">TARGET URL / SCRIPT:</span>
            <div class="url-box">
                <input type="text" id="targetInput" class="url-input" placeholder="https://youtube.com">
                <button class="url-btn" onclick="saveUrl()">SAVE</button>
            </div>
        </div>

        <div class="status-bar" id="statusText">SYSTEM READY</div>
    </div>

    <script>
        // Space Generator
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 70; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * -100}%`;
            star.style.animationDuration = `${Math.random() * 8 + 4}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        let audioCtx = null;
        let isMuted = localStorage.getItem('boom_muted') === 'true';
        let currentVol = parseFloat(localStorage.getItem('boom_volume') || '0.8');

        if (isMuted) currentVol = 0;

        let currentUrl = localStorage.getItem('boom_url') || 'https://www.youtube.com';
        document.getElementById('targetInput').value = currentUrl;
        updateFavicon(currentUrl);

        const slider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');
        slider.value = isMuted ? 0 : currentVol;
        muteBtn.innerText = (isMuted || currentVol === 0) ? '🔇' : '🔊';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.body.addEventListener('click', initAudio, { once: true });

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('boom_muted', isMuted);
            if (isMuted) {
                slider.value = 0;
                muteBtn.innerText = '🔇';
            } else {
                currentVol = parseFloat(localStorage.getItem('boom_last_vol') || '0.8');
                slider.value = currentVol;
                muteBtn.innerText = '🔊';
            }
        }

        function changeVolume(val) {
            currentVol = parseFloat(val);
            if (currentVol > 0) {
                isMuted = false;
                localStorage.setItem('boom_muted', 'false');
                localStorage.setItem('boom_last_vol', currentVol);
                muteBtn.innerText = '🔊';
            } else {
                isMuted = true;
                localStorage.setItem('boom_muted', 'true');
                muteBtn.innerText = '🔇';
            }
            localStorage.setItem('boom_volume', currentVol);
        }

        function playSound() {
            initAudio();
            if (!audioCtx) return;

            const vol = isMuted ? 0 : currentVol;
            if (vol <= 0) return;

            const bufferSize = audioCtx.sampleRate * 1.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 1.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(vol * 0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function updateFavicon(url) {
            try {
                if (url.startsWith('javascript:')) {
                    document.getElementById('targetFavicon').src = 'https://www.google.com/s2/favicons?domain=javascript.info&sz=128';
                    return;
                }
                const domain = new URL(url).hostname;
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch(e) {
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=youtube.com&sz=128`;
            }
        }

        function saveUrl() {
            let input = document.getElementById('targetInput').value.trim();
            if (input && !input.startsWith('http://') && !input.startsWith('https://') && !input.startsWith('javascript:')) {
                input = 'https://' + input;
            }
            currentUrl = input || 'https://www.youtube.com';
            localStorage.setItem('boom_url', currentUrl);
            document.getElementById('targetInput').value = currentUrl;
            updateFavicon(currentUrl);

            document.getElementById('statusText').innerText = 'SAVED!';
            setTimeout(() => { document.getElementById('statusText').innerText = 'SYSTEM READY'; }, 1500);
        }

        async function launchSequence() {
            playSound();
            const rocket = document.getElementById('rocketElement');
            const badge = document.getElementById('parachuteBadge');
            const status = document.getElementById('statusText');

            status.innerText = 'LAUNCHING...';
            status.style.color = '#ff0055';

            rocket.classList.add('rocket-launch');
            await new Promise(r => setTimeout(r, 1600));

            status.innerText = 'LANDING...';
            status.style.color = '#ffcc00';
            badge.classList.add('parachute-drop');
            await new Promise(r => setTimeout(r, 1200));

            if (currentUrl.startsWith('javascript:')) {
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.eval(currentUrl.replace('javascript:', ''));
                    } catch(e) {
                        alert('JS Error: ' + e.message);
                    }
                } else {
                    try {
                        eval(currentUrl.replace('javascript:', ''));
                    } catch(e) {
                        alert('JS Error: ' + e.message);
                    }
                }
            } else {
                if (window.opener && !window.opener.closed) {
                    window.opener.location.href = currentUrl;
                } else {
                    window.open(currentUrl, '_blank');
                }
            }
            window.close();
        }
    </script>
</body>
</html>
