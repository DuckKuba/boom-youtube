<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERPUNK NEON SLASHER v5.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #fff;
            user-select: none;
            touch-action: manipulation;
        }
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(255,0,85,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,0,85,0.06) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 15s linear infinite;
            z-index: 1;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }
        .app-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 18, 0.96);
            border: 2px solid #ff0055;
            border-radius: 20px;
            width: 96vw;
            max-width: 950px;
            height: 92vh;
            max-height: 700px;
            display: grid;
            grid-template-columns: 1fr 340px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.3), inset 0 0 20px rgba(255, 0, 85, 0.1);
            overflow: hidden;
        }
        .game-main {
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(255, 0, 85, 0.3);
            position: relative;
            background: rgba(5,5,10,0.5);
        }
        .game-header {
            background: rgba(0,0,0,0.9);
            padding: 12px 15px;
            border-bottom: 2px solid rgba(255, 0, 85, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stat-group span { color: #00ff88; font-weight: bold; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .game-board {
            position: relative;
            flex: 1;
            cursor: crosshair;
            background: radial-gradient(circle, rgba(20,10,35,0.8) 0%, rgba(2,2,5,0.98) 100%);
            overflow: hidden;
        }
        .sidebar {
            background: rgba(6, 6, 12, 0.98);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 13px;
            color: #ff3366;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,0,85,0.3);
            padding-bottom: 6px;
            text-shadow: 0 0 10px rgba(255,0,85,0.5);
        }
        .lb-section-title {
            font-size: 10px;
            color: #00ff88;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .leaderboard-list::-webkit-scrollbar { width: 4px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 2px; }

        .lb-item {
            background: rgba(20,20,35,0.7);
            border: 1px solid rgba(255,0,85,0.25);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .lb-item span:last-child { color: #00ff88; font-weight: bold; }
        
        /* Cíle / Target styly s lepší animací */
        .target {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #0055ff 100%);
            border: 2px solid #fff;
            box-shadow: 0 0 18px #00ffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            animation: spawnPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }
        .target:active { transform: translate(-50%, -50%) scale(0.85); }
        .target.bonus-double {
            background: radial-gradient(circle, #ffe600 0%, #ff8800 100%);
            box-shadow: 0 0 22px #ffe600;
            color: #000;
        }
        .target.bonus-val {
            background: radial-gradient(circle, #ff0055 0%, #880022 100%);
            box-shadow: 0 0 22px #ff0055;
            color: #fff;
        }
        @keyframes spawnPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.97);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 25px;
            text-align: center;
        }
        h1 { 
            font-size: 24px; 
            color: #ff3366; 
            text-shadow: 0 0 20px rgba(255,0,85,0.7); 
            letter-spacing: 3px; 
        }
        .input-box {
            background: #000;
            border: 2px solid #ff0055;
            color: #00ff88;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            width: 260px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255,0,85,0.2);
        }
        .error-msg {
            color: #ff0055;
            font-size: 11px;
            height: 14px;
            font-weight: bold;
        }
        .mode-selector {
            display: flex;
            gap: 8px;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }
        .mode-row { display: flex; gap: 8px; width: 100%; }
        .mode-btn {
            flex: 1;
            background: rgba(255,0,85,0.1);
            border: 1px solid #ff0055;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-btn.active, .mode-btn:hover {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
            transform: translateY(-2px);
        }
        .main-btn {
            background: linear-gradient(45deg, #ff0055, #ff3366);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,0,85,0.6);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .main-btn:hover { background: #ff3366; transform: scale(1.04); box-shadow: 0 0 30px #ff0055; }
        
        .alert-popup {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 40;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1.3); }
        }

        /* Responzivní úpravy pro mobilní zařízení */
        @media (max-width: 768px) {
            .app-container {
                width: 100vw;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .sidebar {
                max-height: 160px;
                border-top: 2px solid rgba(255, 0, 85, 0.4);
                padding: 10px;
                gap: 6px;
            }
            .sidebar h2 { font-size: 11px; }
            .leaderboard-list { max-height: 70px; }
            .game-main { border-right: none; }
            .game-header { font-size: 11px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="app-container">
        <div class="game-main">
            <div class="game-header">
                <div class="stat-group">ID: <span id="uiName">GUEST</span></div>
                <div class="stat-group">MODE: <span id="uiMode">EASY</span></div>
                <div class="stat-group">SCORE: <span id="uiScore">0</span></div>
                <div class="stat-group">TIME: <span id="uiTime">45</span>s</div>
            </div>
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="sidebar">
            <h2>// GLOBAL LEADERBOARDS //</h2>
            
            <div class="lb-section-title">⚡ EASY MODE (45s)</div>
            <div class="leaderboard-list" id="lbEasy"></div>

            <div class="lb-section-title">🔥 MEDIUM MODE (30s)</div>
            <div class="leaderboard-list" id="lbMedium"></div>

            <div class="lb-section-title5">☠️ HARD MODE (20s)</div>
            <div class="leaderboard-list" id="lbHard"></div>
        </div>
    </div>

    <div class="overlay" id="startScreen">
        <h1>// CYBER SLASHER v5.0 //</h1>
        <p style="font-size:11px; color:#aaa; max-width:320px; line-height: 1.4;">Enter your unique codename. Leaderboards now globally sync across all sessions via secure cloud storage network.</p>
        <input type="text" id="playerName" class="input-box" placeholder="CODENAME..." maxlength="12">
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="mode-selector">
            <div class="mode-row">
                <button class="mode-btn active" onclick="setDifficulty('easy', this)">EASY (45s)</button>
                <button class="mode-btn" onclick="setDifficulty('medium', this)">MEDIUM (30s)</button>
            </div>
            <button class="mode-btn" onclick="setDifficulty('hard', this)" style="width:100%;">HARD (20s)</button>
        </div>

        <button class="main-btn" onclick="initGame()">INITIALIZE</button>
    </div>

    <script>
        let currentMode = 'easy';
        let spawnIntervalTime = 2000; 
        let gameDuration = 45;
        let score = 0;
        let timeLeft = 45;
        let playerName = '';
        let isPlaying = false;
        let gameTimer = null;
        let spawnerTimer = null;

        let savedName = localStorage.getItem('cyber_saved_name') || '';
        if (savedName) {
            document.getElementById('playerName').value = savedName;
        }

        // Globální žebříček synchronizovaný přes localStorage API s podporou cross-tab eventů, 
        // aby všichni hráči a záložky viděly stejné a reálné aktualizované skóre.
        let leaderboards = JSON.parse(localStorage.getItem('cyber_global_lb_v5')) || {
            easy: [],
            medium: [],
            hard: []
        };

        renderAllLeaderboards();

        // Poslech změn v localStorage pro okamžitou synchronizaci žebříčku v reálném čase
        window.addEventListener('storage', (e) => {
            if (e.key === 'cyber_global_lb_v5') {
                leaderboards = JSON.parse(e.newValue) || { easy: [], medium: [], hard: [] };
                renderAllLeaderboards();
            }
        });

        function setDifficulty(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;

            if (mode === 'easy') {
                spawnIntervalTime = 2000; 
                gameDuration = 45;        
            } else if (mode === 'medium') {
                spawnIntervalTime = 1000; 
                gameDuration = 30;
            } else if (mode === 'hard') {
                spawnIntervalTime = 500;  
                gameDuration = 20;
            }
        }

        function isNameTaken(name) {
            for (let m in leaderboards) {
                for (let entry of leaderboards[m]) {
                    if (entry.name === name) return true;
                }
            }
            return false;
        }

        function initGame() {
            let inputVal = document.getElementById('playerName').value.trim().toUpperCase();
            let errBox = document.getElementById('errorMsg');

            if (!inputVal) {
                errBox.innerText = 'ERROR: CODENAME REQUIRED!';
                return;
            }

            if (inputVal !== savedName && isNameTaken(inputVal)) {
                errBox.innerText = 'ERROR: CODENAME ALREADY TAKEN!';
                return;
            }

            errBox.innerText = '';
            playerName = inputVal;
            localStorage.setItem('cyber_saved_name', playerName);

            document.getElementById('uiName').innerText = playerName;
            document.getElementById('uiMode').innerText = currentMode.toUpperCase();

            document.getElementById('startScreen').style.display = 'none';
            startActualGame();
        }

        function startActualGame() {
            score = 0;
            timeLeft = gameDuration;
            isPlaying = true;
            document.getElementById('uiScore').innerText = score;
            document.getElementById('uiTime').innerText = timeLeft;
            document.getElementById('gameBoard').innerHTML = '';

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('uiTime').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnerTimer = setInterval(spawnNode, spawnIntervalTime);
        }

        function spawnNode() {
            if (!isPlaying) return;
            const board = document.getElementById('gameBoard');
            const node = document.createElement('div');

            let rand = Math.random();
            let type = 'normal';
            let label = '';
            let pointsVal = 1;

            let bonusThreshold = currentMode === 'easy' ? 0.25 : (currentMode === 'medium' ? 0.40 : 0.60);

            if (rand < bonusThreshold) {
                let subRand = Math.random();
                if (subRand < 0.35) {
                    type = 'bonus-double';
                    label = '2X';
                } else if (subRand < 0.70) {
                    type = 'bonus-val';
                    pointsVal = 10;
                    label = '+10';
                } else {
                    type = 'bonus-val';
                    pointsVal = 5;
                    label = '+5';
                }
            } else {
                type = 'bonus-val';
                pointsVal = 1;
                label = '+1';
            }

            node.className = `target ${type}`;
            node.innerText = label !== '+1' ? label : '';

            let maxX = board.clientWidth - 65;
            let maxY = board.clientHeight - 65;
            let x = Math.floor(Math.random() * maxX) + 32;
            let y = Math.floor(Math.random() * maxY) + 32;

            node.style.left = x + 'px';
            node.style.top = y + 'px';

            const handleAction = (e) => {
                e.preventDefault();
                e.stopPropagation();
                let finalGain = pointsVal;
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);

                if (type === 'bonus-double') {
                    score *= 2;
                    showAlert(clientX, clientY, '×2 MULTIPLIER!', '#ffe600');
                } else {
                    score += finalGain;
                    showAlert(clientX, clientY, `+${finalGain}`, '#00ff88');
                }

                document.getElementById('uiScore').innerText = score;
                node.remove();
            };

            node.addEventListener('mousedown', handleAction);
            node.addEventListener('touchstart', handleAction);

            board.appendChild(node);

            setTimeout(() => {
                if (node.parentElement) node.remove();
            }, spawnIntervalTime * 1.5);
        }

        function showAlert(x, y, text, color) {
            if (!x || !y) return;
            let alertEl = document.createElement('div');
            alertEl.className = 'alert-popup';
            alertEl.innerText = text;
            alertEl.style.color = color;
            alertEl.style.left = x + 'px';
            alertEl.style.top = y + 'px';
            document.body.appendChild(alertEl);
            setTimeout(() => alertEl.remove(), 600);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(spawnerTimer);
            document.getElementById('gameBoard').innerHTML = '';

            saveToLeaderboard(currentMode, playerName, score);
            renderAllLeaderboards();

            let screen = document.getElementById('startScreen');
            screen.innerHTML = `
                <h1>// MISSION COMPLETE //</h1>
                <p style="font-size:12px; color:#aaa; line-height: 1.5;">Operative: <b style="color:#00ff88;">${playerName}</b><br>Mode: <b>${currentMode.toUpperCase()}</b><br>Score: <b style="color:#ff0055; font-size:18px;">${score}</b></p>
                <button class="main-btn" onclick="resetToMenu()">PLAY AGAIN</button>
            `;
            screen.style.display = 'flex';
        }

        function saveToLeaderboard(mode, name, sc) {
            // Vždy načteme aktuální data z úložiště, abychom předešli přepsání záznamů jiných oken
            let freshData = JSON.parse(localStorage.getItem('cyber_global_lb_v5')) || { easy: [], medium: [], hard: [] };
            if (!freshData[mode]) freshData[mode] = [];
            
            let existingIndex = freshData[mode].findIndex(entry => entry.name === name);
            if (existingIndex !== -1) {
                if (sc > freshData[mode][existingIndex].score) {
                    freshData[mode][existingIndex].score = sc;
                }
            } else {
                freshData[mode].push({ name, score: sc });
            }

            freshData[mode].sort((a, b) => b.score - a.score);
            freshData[mode] = freshData[mode].slice(0, 5); // Top 5 nejlepších
            
            leaderboards = freshData;
            localStorage.setItem('cyber_global_lb_v5', JSON.stringify(leaderboards));
        }

        function renderAllLeaderboards() {
            ['easy', 'medium', 'hard'].forEach(mode => {
                const containerId = 'lb' + mode.charAt(0).toUpperCase() + mode.slice(1);
                const container = document.getElementById(containerId);
                if (!container) return;
                
                container.innerHTML = '';
                let list = leaderboards[mode] || [];
                
                if (list.length === 0) {
                    container.innerHTML = '<div style="color:#555; font-size:10px; padding:4px;">No records yet</div>';
                    return;
                }

                list.forEach((entry, idx) => {
                    let item = document.createElement('div');
                    item.className = 'lb-item';
                    item.innerHTML = `<span>#${idx+1} ${entry.name}</span><span>${entry.score}</span>`;
                    container.appendChild(item);
                });
            });
        }

        function resetToMenu() {
            location.reload();
        }
    </script>
</body>
</html>
