<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #030308;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
        }

        /* Moving Space Background with Stars */
        .bg-space {
            position: absolute;
            width: 140%;
            height: 140%;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 1;
            animation: moveSpace 30s infinite alternate ease-in-out;
            filter: brightness(0.85) contrast(1.1);
        }

        @keyframes moveSpace {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.12) translate(-2%, -2%) rotate(1.5deg); }
            100% { transform: scale(1.05) translate(2%, 2%) rotate(-1.5deg); }
        }

        /* Adaptive Cyber Card */
        .cyber-card {
            position: relative;
            z-index: 10;
            background: rgba(12, 12, 20, 0.88);
            border: 3px solid #ff0055;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 45px rgba(255, 0, 85, 0.6);
            width: 520px;
            max-width: 90vw;
            backdrop-filter: blur(6px);
        }

        .header-title {
            font-size: 18px;
            letter-spacing: 3px;
            color: #ff3366;
            margin-bottom: 15px;
            font-weight: bold;
            margin-right: auto;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        /* Mini Audio Controls */
        .audio-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.75);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            z-index: 20;
        }

        .mute-btn {
            cursor: pointer;
            font-size: 12px;
            background: none;
            border: none;
            color: #fff;
            outline: none;
        }

        .volume-slider {
            width: 40px;
            height: 3px;
            accent-color: #ff0055;
            cursor: pointer;
        }

        .stage-area {
            position: relative;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #launchBtn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055 0%, #660022 100%);
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            border: 4px solid #ff6699;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
            z-index: 2;
        }

        #launchBtn:hover { transform: scale(1.05); }

        #rocketElement {
            position: absolute;
            font-size: 70px;
            display: none;
            z-index: 10;
        }

        .rocket-launch {
            display: block !important;
            animation: flyUp 1.8s ease-in forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            20% { transform: translateY(10px) scale(1.1); }
            100% { transform: translateY(-600px) scale(0.4); opacity: 0; }
        }

        #parachuteBadge {
            position: absolute;
            top: -200px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 8;
        }

        .parachute-drop {
            display: flex !important;
            animation: dropDown 1.2s ease-out forwards;
        }

        @keyframes dropDown {
            0% { top: -200px; transform: scale(0.5); }
            100% { top: 10px; transform: scale(1); }
        }

        .logo-box {
            width: 70px; height: 70px;
            background: #111;
            border: 3px solid #ff3366;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #ff0055;
        }

        .logo-box img { width: 40px; height: 40px; object-fit: contain; }

        .url-section {
            width: 100%;
            margin-top: 15px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        .url-label {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 5px;
            display: block;
        }

        .url-box {
            display: flex;
            gap: 6px;
        }

        .url-input {
            flex: 1;
            background: #000;
            border: 1px solid #ff0055;
            border-radius: 5px;
            color: #00ff88;
            font-size: 12px;
            padding: 6px 10px;
            outline: none;
        }

        .url-btn {
            background: #ff0055;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 0 12px;
            cursor: pointer;
        }

        .status-bar {
            margin-top: 12px;
            font-size: 12px;
            color: #00ff88;
            font-weight: bold;
        }

        /* --- STYLY PRO MALÉ OKNO (BOOKMARKLET) --- */
        @media (max-width: 450px), (max-height: 450px) {
            .cyber-card {
                width: 230px;
                padding: 10px;
                border-radius: 10px;
                border-width: 2px;
            }
            .header-title {
                font-size: 9px;
                margin-bottom: 4px;
                letter-spacing: 1px;
            }
            .audio-controls {
                top: 5px;
                right: 5px;
                padding: 1px 4px;
            }
            .mute-btn { font-size: 8px; }
            .volume-slider { width: 25px; height: 2px; }
            .stage-area { height: 55px; }
            #launchBtn {
                width: 50px;
                height: 50px;
                font-size: 9px;
                border-width: 2px;
            }
            #rocketElement { font-size: 30px; }
            .logo-box { width: 32px; height: 32px; border-width: 2px; }
            .logo-box img { width: 18px; height: 18px; }
            .url-section { margin-top: 6px; padding: 4px; }
            .url-label { font-size: 7.5px; margin-bottom: 2px; }
            .url-input { font-size: 9px; padding: 3px; }
            .url-btn { font-size: 8px; padding: 0 6px; }
            .status-bar { font-size: 8.5px; margin-top: 4px; }
        }
    </style>
</head>
<body>

    <div class="bg-space"></div>

    <div class="cyber-card">
        <div class="audio-controls">
            <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
        </div>

        <div class="header-title">// BOOM CONTROL //</div>

        <div class="stage-area">
            <button id="launchBtn" onclick="launchSequence()">BOOM</button>
            <div id="rocketElement">🚀</div>

            <div id="parachuteBadge">
                <span style="font-size:16px;">🪂</span>
                <div class="logo-box">
                    <img id="targetFavicon" src="" alt="Target">
                </div>
            </div>
        </div>

        <div class="url-section">
            <span class="url-label">TARGET URL / SCRIPT:</span>
            <div class="url-box">
                <input type="text" id="targetInput" class="url-input" placeholder="https://youtube.com">
                <button class="url-btn" onclick="saveUrl()">SAVE</button>
            </div>
        </div>

        <div class="status-bar" id="statusText">SYSTEM READY</div>
    </div>

    <script>
        let audioCtx = null;
        let isMuted = localStorage.getItem('boom_muted') === 'true';
        let currentVol = parseFloat(localStorage.getItem('boom_volume') || '0.8');

        if (isMuted) currentVol = 0;

        let currentUrl = localStorage.getItem('boom_url') || 'https://www.youtube.com';
        document.getElementById('targetInput').value = currentUrl;
        updateFavicon(currentUrl);

        const slider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');
        slider.value = isMuted ? 0 : currentVol;
        muteBtn.innerText = (isMuted || currentVol === 0) ? '🔇' : '🔊';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.body.addEventListener('click', initAudio, { once: true });

        function toggleMute() {
            isMuted = !isMuted;
            localStorage.setItem('boom_muted', isMuted);
            if (isMuted) {
                slider.value = 0;
                muteBtn.innerText = '🔇';
            } else {
                currentVol = parseFloat(localStorage.getItem('boom_last_vol') || '0.8');
                slider.value = currentVol;
                muteBtn.innerText = '🔊';
            }
        }

        function changeVolume(val) {
            currentVol = parseFloat(val);
            if (currentVol > 0) {
                isMuted = false;
                localStorage.setItem('boom_muted', 'false');
                localStorage.setItem('boom_last_vol', currentVol);
                muteBtn.innerText = '🔊';
            } else {
                isMuted = true;
                localStorage.setItem('boom_muted', 'true');
                muteBtn.innerText = '🔇';
            }
            localStorage.setItem('boom_volume', currentVol);
        }

        function playSound() {
            initAudio();
            if (!audioCtx) return;

            const vol = isMuted ? 0 : currentVol;
            if (vol <= 0) return;

            const bufferSize = audioCtx.sampleRate * 1.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 1.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(vol * 0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function updateFavicon(url) {
            try {
                if (url.startsWith('javascript:')) {
                    document.getElementById('targetFavicon').src = 'https://www.google.com/s2/favicons?domain=javascript.info&sz=128';
                    return;
                }
                const domain = new URL(url).hostname;
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch(e) {
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=youtube.com&sz=128`;
            }
        }

        function saveUrl() {
            let input = document.getElementById('targetInput').value.trim();
            if (input && !input.startsWith('http://') && !input.startsWith('https://') && !input.startsWith('javascript:')) {
                input = 'https://' + input;
            }
            currentUrl = input || 'https://www.youtube.com';
            localStorage.setItem('boom_url', currentUrl);
            document.getElementById('targetInput').value = currentUrl;
            updateFavicon(currentUrl);

            document.getElementById('statusText').innerText = 'SAVED!';
            setTimeout(() => { document.getElementById('statusText').innerText = 'SYSTEM READY'; }, 1500);
        }

        async function launchSequence() {
            playSound();
            const rocket = document.getElementById('rocketElement');
            const badge = document.getElementById('parachuteBadge');
            const status = document.getElementById('statusText');

            status.innerText = 'LAUNCHING...';
            status.style.color = '#ff0055';

            rocket.classList.add('rocket-launch');
            await new Promise(r => setTimeout(r, 1600));

            status.innerText = 'LANDING...';
            status.style.color = '#ffcc00';
            badge.classList.add('parachute-drop');
            await new Promise(r => setTimeout(r, 1200));

            if (currentUrl.startsWith('javascript:')) {
                let jsCode = decodeURIComponent(currentUrl.replace(/^javascript:/i, ''));
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.eval(jsCode);
                    } catch(e) {
                        alert('Chyba při spuštění skriptu: ' + e.message);
                    }
                } else {
                    try {
                        eval(jsCode);
                    } catch(e) {
                        alert('Chyba při spuštění skriptu: ' + e.message);
                    }
                }
            } else {
                if (window.opener && !window.opener.closed) {
                    window.opener.location.href = currentUrl;
                } else {
                    window.open(currentUrl, '_blank');
                }
            }
            window.close();
        }
    </script>
</body>
</html>
