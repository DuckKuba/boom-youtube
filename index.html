<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK NEON SLASHER v2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(255,0,85,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,0,85,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        .app-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 18, 0.95);
            border: 2px solid #ff0055;
            border-radius: 16px;
            width: 850px;
            max-width: 96vw;
            height: 580px;
            display: grid;
            grid-template-columns: 1fr 280px;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(0,255,136,0.05);
            overflow: hidden;
        }
        .game-main {
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(255, 0, 85, 0.3);
            position: relative;
        }
        .game-header {
            background: rgba(0,0,0,0.85);
            padding: 15px 20px;
            border-bottom: 2px solid rgba(255, 0, 85, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .stat-group span { color: #00ff88; font-weight: bold; }
        .game-board {
            position: relative;
            flex: 1;
            cursor: crosshair;
            background: radial-gradient(circle, rgba(15,10,25,0.9) 0%, rgba(2,2,5,0.98) 100%);
            overflow: hidden;
        }
        .sidebar {
            background: rgba(5, 5, 10, 0.98);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }
        .sidebar h2 {
            font-size: 14px;
            color: #ff3366;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,0,85,0.3);
            padding-bottom: 8px;
        }
        .leaderboard-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }
        .lb-item {
            background: rgba(20,20,30,0.6);
            border: 1px solid rgba(255,0,85,0.2);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lb-item span:last-child { color: #00ff88; font-weight: bold; }
        
        /* Cíle */
        .target {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #0055ff 100%);
            border: 2px solid #fff;
            box-shadow: 0 0 15px #00ffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            animation: spawnPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, -50%);
        }
        .target.bonus-double {
            background: radial-gradient(circle, #ffe600 0%, #ff8800 100%);
            box-shadow: 0 0 20px #ffe600;
            color: #000;
        }
        .target.bonus-plus {
            background: radial-gradient(circle, #00ff88 0%, #008844 100%);
            box-shadow: 0 0 20px #00ff88;
            color: #000;
        }
        @keyframes spawnPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Modální obrazovky */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.95);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 30px;
            text-align: center;
        }
        h1 { font-size: 24px; color: #ff3366; text-shadow: 0 0 15px rgba(255,0,85,0.6); letter-spacing: 3px; }
        .input-box {
            background: #000;
            border: 2px solid #ff0055;
            color: #00ff88;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            border-radius: 6px;
            outline: none;
            width: 260px;
            text-align: center;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            background: rgba(255,0,85,0.1);
            border: 1px solid #ff0055;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Consolas', monospace;
            font-weight: bold;
            transition: 0.2s;
        }
        .mode-btn.active, .mode-btn:hover {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }
        .main-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
            transition: 0.2s;
        }
        .main-btn:hover { background: #ff3366; transform: scale(1.05); }
        .alert-popup {
            position: absolute;
            font-weight: bold;
            font-size: 13px;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 40;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="app-container">
        <div class="game-main">
            <div class="game-header">
                <div class="stat-group">OPERATIVE: <span id="uiName">GUEST</span></div>
                <div class="stat-group">MODE: <span id="uiMode">MEDIUM</span></div>
                <div class="stat-group">SCORE: <span id="uiScore">0</span></div>
                <div class="stat-group">TIME: <span id="uiTime">30</span>s</div>
            </div>

            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="sidebar">
            <h2>// LEADERBOARD //</h2>
            <div class="leaderboard-list" id="lbContainer"></div>
        </div>
    </div>

    <!-- Start / Setup Overlay -->
    <div class="overlay" id="startScreen">
        <h1>// CYBER SLASHER v2.0 //</h1>
        <p style="font-size:12px; color:#aaa; max-width:350px;">Zadej své kódové jméno, zvol obtížnost a zlikviduj co nejvíce neonových uzlů. Pozor na vzácné bonusy!</p>
        <input type="text" id="playerName" class="input-box" placeholder="ENTER CODENAME..." maxlength="12">
        
        <div class="mode-selector">
            <button class="mode-btn" onclick="setDifficulty('easy', this)">EASY (1.5s)</button>
            <button class="mode-btn active" onclick="setDifficulty('medium', this)">MEDIUM (1.0s)</button>
            <button class="mode-btn" onclick="setDifficulty('hard', this)">HARD (0.5s)</button>
        </div>

        <button class="main-btn" onclick="initGame()">INITIALIZE</button>
    </div>

    <script>
        let currentMode = 'medium';
        let spawnIntervalTime = 1000; // Medium výchozí
        let score = 0;
        let timeLeft = 30;
        let playerName = 'GUEST';
        let isPlaying = false;
        let gameTimer = null;
        let spawnerTimer = null;

        let leaderboards = JSON.parse(localStorage.getItem('cyber_lb_v2')) || {
            easy: [{name: 'CYBER_PUNK', score: 45}, {name: 'NEON_X', score: 32}],
            medium: [{name: 'GLITCH', score: 58}, {name: 'ZERO', score: 41}],
            hard: [{name: 'SYNTH', score: 74}, {name: 'VEX', score: 62}]
        };

        renderLeaderboard();

        function setDifficulty(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;

            if (mode === 'easy') spawnIntervalTime = 1500;       // pomalejší o 1.5s (celkem 2.5s interval nebo nastaveno dle logiky)
            else if (mode === 'medium') spawnIntervalTime = 1000;  // základ
            else if (mode === 'hard') spawnIntervalTime = 500;     // o 0.5s rychlejší než medium
        }

        function initGame() {
            let inputVal = document.getElementById('playerName').value.trim();
            playerName = inputVal !== '' ? inputVal.toUpperCase() : 'ANONYMOUS';
            document.getElementById('uiName').innerText = playerName;
            document.getElementById('uiMode').innerText = currentMode.toUpperCase();

            document.getElementById('startScreen').style.display = 'none';
            startActualGame();
        }

        function startActualGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;
            document.getElementById('uiScore').innerText = score;
            document.getElementById('uiTime').innerText = timeLeft;
            document.getElementById('gameBoard').innerHTML = '';

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('uiTime').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnerTimer = setInterval(spawnNode, spawnIntervalTime);
        }

        function spawnNode() {
            if (!isPlaying) return;
            const board = document.getElementById('gameBoard');
            const node = document.createElement('div');

            // Šance na bonusy (velmi malá šance)
            let rand = Math.random();
            let type = 'normal';
            let label = '';

            if (rand < 0.08) {
                type = 'bonus-double';
                label = '2X';
            } else if (rand < 0.16) {
                type = 'bonus-plus';
                label = '+10';
            }

            node.className = `target ${type}`;
            node.innerText = label;

            let maxX = board.clientWidth - 60;
            let maxY = board.clientHeight - 60;
            let x = Math.floor(Math.random() * maxX) + 30;
            let y = Math.floor(Math.random() * maxY) + 30;

            node.style.left = x + 'px';
            node.style.top = y + 'px';

            node.onmousedown = (e) => {
                e.stopPropagation();
                let pointsGained = 1;

                if (type === 'bonus-double') {
                    pointsGained *= 2;
                    showAlert(e.clientX, e.clientY, '×2 MULTIPLIER!', '#ffe600');
                } else if (type === 'bonus-plus') {
                    pointsGained += 10;
                    showAlert(e.clientX, e.clientY, '+10 SECRETS!', '#00ff88');
                } else {
                    showAlert(e.clientX, e.clientY, '+1', '#00ffff');
                }

                score += pointsGained;
                document.getElementById('uiScore').innerText = score;
                node.remove();
            };

            board.appendChild(node);

            // Uzol po chvíli zmizí, pokud na něj nikdo neklikne
            setTimeout(() => {
                if (node.parentElement) node.remove();
            }, spawnIntervalTime * 1.2);
        }

        function showAlert(x, y, text, color) {
            let alertEl = document.createElement('div');
            alertEl.className = 'alert-popup';
            alertEl.innerText = text;
            alertEl.style.color = color;
            alertEl.style.left = x + 'px';
            alertEl.style.top = y + 'px';
            document.body.appendChild(alertEl);
            setTimeout(() => alertEl.remove(), 600);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(spawnerTimer);
            document.getElementById('gameBoard').innerHTML = '';

            // Uložení do leaderboardu pro daný mód
            saveToLeaderboard(currentMode, playerName, score);
            renderLeaderboard();

            let screen = document.getElementById('startScreen');
            screen.innerHTML = `
                <h1>// MISSION COMPLETE //</h1>
                <p style="font-size:13px; color:#aaa;">Operative: <b style="color:#00ff88;">${playerName}</b><br>Mode: <b>${currentMode.toUpperCase()}</b><br>Final Score: <b style="color:#ff0055; font-size:18px;">${score}</b></p>
                <button class="main-btn" onclick="resetToMenu()">PLAY AGAIN</button>
            `;
            screen.style.display = 'flex';
        }

        function saveToLeaderboard(mode, name, sc) {
            if (!leaderboards[mode]) leaderboards[mode] = [];
            leaderboards[mode].push({ name, score: sc });
            leaderboards[mode].sort((a, b) => b.score - a.score);
            leaderboards[mode] = leaderboards[mode].slice(0, 5); // Necháme top 5
            localStorage.setItem('cyber_lb_v2', JSON.stringify(leaderboards));
        }

        function renderLeaderboard() {
            const container = document.getElementById('lbContainer');
            container.innerHTML = '';

            // Zobrazíme žebříček pro aktuálně vybraný nebo spuštěný mód, případně smíšený. Tady uděláme tabulku pro aktuální mód:
            let list = leaderboards[currentMode] || [];
            if (list.length === 0) {
                container.innerHTML = '<div style="color:#555; text-align:center; font-size:11px; margin-top:20px;">NO RECORDS YET</div>';
                return;
            }

            list.forEach((entry, idx) => {
                let item = document.createElement('div');
                item.className = 'lb-item';
                item.innerHTML = `<span>#${idx+1} ${entry.name}</span><span>${entry.score} pts</span>`;
                container.appendChild(item);
            });
        }

        function resetToMenu() {
            location.reload();
        }
    </script>
</body>
</html>
