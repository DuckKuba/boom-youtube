<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <!-- Zásadní meta tag pro mobily, zakazuje zoom, nastavuje měřítko na 1:1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER_NEXUS_ARCADE // v207.0 MOBILE ELITE</title>
    <style>
        /* --- RESET & ZÁKLADNÍ STYLING --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff007f;
            --neon-gold: #ffcc00;
            --neon-purple: #d946ef;
            --bg-dark: #010005;
            --panel-bg: rgba(4, 3, 15, 0.98);
            --text-main: #fff;
            --text-muted: #88aacc;
            
            /* Responzivní velikosti prvků */
            --font-size-xs: 10px;
            --font-size-sm: 12px;
            --font-size-md: 14px;
            --font-size-lg: 18px;
            --font-size-xl: 24px;
            
            --card-width-desktop: 220px;
            --card-width-mobile: 45vw; /* Karty jsou cca polovina šířky obrazovky */
        }

        body {
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Hlavní stránka nesmí scrollovat */
            color: var(--neon-cyan);
            user-select: none;
            touch-action: none; /* Zamezí nativnímu chování mobilního prohlížeče (zoom, pull-to-refresh) */
            font-size: var(--font-size-sm);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* --- POZADÍ A EFEKTY --- */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.14;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 128, 0.01), rgba(0, 255, 204, 0.005), rgba(217, 70, 239, 0.01));
            background-size: 100% 3px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- HLAVNÍ KONTEJNER APLIKACE --- */
        .app-wrapper {
            position: relative;
            z-index: 10;
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            width: 100vw;
            height: 100vh; /* Vyplní celou obrazovku mobilu */
            max-width: 1280px;
            max-height: 860px; /* Na velkých monitorech omezíme */
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
            overflow: hidden;
            transition: all 0.5s ease;
            margin: auto; /* Centrování, pokud je max-width/height aktivní */
        }

        /* Téma pro holčičí hru */
        .app-wrapper.girly-theme {
            --neon-cyan: #ff99cc;
            --neon-pink: #ff3399;
            --neon-purple: #ff66b2;
            --neon-gold: #ffcc00;
            background: rgba(20, 5, 20, 0.99);
            border-color: var(--neon-pink);
            box-shadow: 0 0 80px rgba(255, 51, 153, 0.3);
        }
        .app-wrapper.girly-theme .nav-title { color: #ffb3d9; text-shadow: 0 0 10px var(--neon-pink); }
        .app-wrapper.girly-theme .credit-badge { color: var(--neon-gold) !important; text-shadow: 0 0 10px var(--neon-gold) !important; }

        /* --- HORNÍ NAVIGACE --- */
        .top-nav {
            background: rgba(1, 5, 16, 0.99);
            padding: 10px 15px;
            border-bottom: 2px solid rgba(0, 255, 204, 0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--font-size-xs);
            letter-spacing: 1px;
            height: 40px; /* Pevná výška */
            flex-shrink: 0;
        }

        .nav-title { color: var(--neon-pink); font-weight: bold; text-shadow: 0 0 8px var(--neon-pink); }
        .nav-stats { display: flex; gap: 12px; align-items: center; }
        .nav-data { color: var(--text-main); text-shadow: 0 0 5px var(--neon-cyan); }
        .credit-badge { color: var(--neon-gold) !important; text-shadow: 0 0 10px var(--neon-gold) !important; font-weight: bold; }

        /* --- SPOLEČNÉ STYLY PRO OBRAZOVKY (HUB, SHOP, ARENA) --- */
        .screen {
            flex: 1;
            display: none; /* Skryté dokud se nezapnou JS */
            flex-direction: column;
            overflow-y: auto; /* Povolíme scrollování obsahu */
            padding: 15px;
            gap: 15px;
            -webkit-overflow-scrolling: touch; /* Hladké scrollování na iOS */
        }

        .screen-active { display: flex; }

        .screen-title {
            font-size: var(--font-size-xl);
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* --- NOTIFIKACE (TOASTY) --- */
        #toastContainer {
            position: absolute;
            top: 50px; /* Pod navigací */
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            width: 90%;
            max-width: 350px;
        }

        .toast-msg {
            background: rgba(3, 12, 24, 0.98);
            border: 2px solid var(--neon-cyan);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: var(--font-size-sm);
            text-align: center;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
            animation: toastIn 0.3s ease forwards;
            letter-spacing: 0.5px;
        }
        .toast-msg.gold { border-color: var(--neon-gold); color: var(--neon-gold); box-shadow: 0 0 15px rgba(255,204,0,0.4); }
        .toast-msg.pink { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,127,0.4); }

        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- HUB SCREEN (HLAVNÍ MENU) --- */
        .hub-screen {
            justify-content: center;
            align-items: center;
        }

        /* Přihlašovací pole */
        .auth-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
        }

        .input-box {
            background: #000;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: var(--font-size-md);
            outline: none;
            width: 100%;
            text-align: center;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,255,204,0.1);
        }
        .input-box::placeholder { color: rgba(0, 255, 204, 0.3); }
        .input-box:focus { border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

        .error-msg { color: var(--neon-pink); font-size: var(--font-size-xs); height: 14px; font-weight: bold; }

        /* Grid her a žebříčku */
        .hub-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
        }

        .games-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            flex: 2; /* Hry mají větší váhu */
            min-width: 280px;
        }

        /* Karty her a obchodu */
        .game-card {
            background: linear-gradient(145deg, rgba(18, 11, 42, 0.95) 0%, rgba(4, 2, 14, 0.99) 100%);
            border: 2px solid rgba(0, 255, 204, 0.35);
            border-radius: 14px;
            width: var(--card-width-desktop);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-grow: 1; /* Na mobilu se roztáhnou */
            max-width: 250px;
        }

        /* Responzivní úprava šířky karet */
        @media (max-width: 600px) {
            .game-card { width: var(--card-width-mobile); max-width: none; }
        }

        .game-card:hover { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); transform: translateY(-3px); }
        .game-card:active { transform: scale(0.98); }

        .game-icon {
            font-size: 32px;
            background: rgba(0,255,204,0.08);
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed var(--neon-cyan);
            margin-bottom: 5px;
        }
