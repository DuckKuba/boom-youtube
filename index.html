<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER_SLASHER_NET // v10.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #010103;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #00ff66;
            user-select: none;
            touch-action: manipulation;
        }

        /* Matrix / Hacker Canvas Background */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 4px 100%;
            z-index: 2;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 10;
            background: rgba(2, 5, 10, 0.92);
            border: 1px solid #00ff66;
            border-radius: 6px;
            width: 96vw;
            max-width: 980px;
            height: 94vh;
            max-height: 720px;
            display: grid;
            grid-template-columns: 1fr 350px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
            overflow: hidden;
        }

        .game-main {
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0, 255, 102, 0.3);
            position: relative;
        }

        .game-header {
            background: rgba(0, 10, 5, 0.95);
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
        }
        .stat-group span { color: #fff; font-weight: bold; text-shadow: 0 0 6px #00ff66; }

        .game-board {
            position: relative;
            flex: 1;
            cursor: crosshair;
            background: radial-gradient(circle, rgba(0,20,10,0.6) 0%, rgba(1,2,5,0.98) 100%);
            overflow: hidden;
        }

        /* Sidebar & Live Cloud Leaderboard */
        .sidebar {
            background: rgba(3, 8, 5, 0.96);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 8px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 12px;
            color: #00ff66;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(0,255,102,0.4);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sync-dot {
            width: 8px; height: 8px; background: #00ff66; border-radius: 50%;
            box-shadow: 0 0 8px #00ff66; animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .lb-section-title {
            font-size: 10px;
            color: #00cc55;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
            max-height: 95px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .leaderboard-list::-webkit-scrollbar { width: 3px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: #00ff66; }

        .lb-item {
            background: rgba(0, 20, 10, 0.7);
            border-left: 2px solid #00ff66;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ccc;
        }
        .lb-item.me { background: rgba(0, 255, 102, 0.15); color: #fff; font-weight: bold; }
        .lb-item span:last-child { color: #00ff66; }

        /* Hacker Targets / Nodes */
        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #00ff66;
            animation: nodeSpawn 0.2s ease-out;
            transform: translate(-50%, -50%);
        }
        .target::before { content: 'SYS_'; font-size: 7px; opacity: 0.6; }
        @keyframes nodeSpawn { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .target.bomb {
            background: rgba(255, 0, 60, 0.15);
            border-color: #ff003c;
            color: #ff003c;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.5);
        }
        .target.bomb::before { content: 'MALWARE'; font-size: 6px; }

        .target.golden {
            background: rgba(255, 204, 0, 0.15);
            border-color: #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }
        .target.golden::before { content: 'ROOT'; }

        /* Overlay & Menus */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 3, 6, 0.96);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 20px; color: #00ff66; text-shadow: 0 0 12px rgba(0,255,102,0.6); letter-spacing: 2px; }
        
        .input-box {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
            width: 240px;
            text-align: center;
            box-shadow: inset 0 0 8px rgba(0,255,102,0.2);
        }
        .error-msg { color: #ff003c; font-size: 11px; height: 14px; font-weight: bold; }

        .mode-selector { display: flex; gap: 6px; width: 100%; max-width: 260px; }
        .mode-btn {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(0,255,102,0.4);
            color: #00ff66;
            padding: 8px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            font-weight: bold;
            transition: 0.2s;
        }
        .mode-btn.active, .mode-btn:hover { background: #00ff66; color: #000; box-shadow: 0 0 10px #00ff66; }

        .main-btn {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
            transition: 0.2s;
            text-transform: uppercase;
        }
        .main-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }

        .alert-popup {
            position: absolute;
            font-weight: bold;
            font-size: 12px;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 40;
            text-shadow: 0 0 6px #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(1.2); }
        }

        @media (max-width: 768px) {
            .app-container { width: 100vw; height: 100vh; max-height: none; border-radius: 0; border: none; grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .sidebar { max-height: 140px; border-top: 1px solid rgba(0,255,102,0.3); padding: 8px; gap: 4px; }
            .leaderboard-list { max-height: 50px; }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>

    <div class="app-container">
        <div class="game-main">
            <div class="game-header">
                <div class="stat-group">USER: <span id="uiName">ANON</span></div>
                <div class="stat-group">COMBO: <span id="uiCombo">0x</span></div>
                <div class="stat-group">SCORE: <span id="uiScore">0</span></div>
                <div class="stat-group">TIME: <span id="uiTime">30</span>s</div>
            </div>
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="sidebar">
            <h2>// CLOUD_NET_DB <div class="sync-dot" title="Global Cloud Sync Active"></div></h2>
            
            <div class="lb-section-title">> EASY PROTOCOL (45s)</div>
            <div class="leaderboard-list" id="lbEasy"></div>

            <div class="lb-section-title">> MEDIUM PROTOCOL (30s)</div>
            <div class="leaderboard-list" id="lbMedium"></div>

            <div class="lb-section-title">> HARD PROTOCOL (20s)</div>
            <div class="leaderboard-list" id="lbHard"></div>
        </div>
    </div>

    <div class="overlay" id="startScreen">
        <h1>// SYSTEM OVERRIDE v10.0 //</h1>
        <p style="font-size:10px; color:#88cc99; max-width:320px; line-height: 1.4;">Enter your unique handle. Names are locked globally. Destroy green sys nodes, grab root golden nodes, avoid red malware firewalls!</p>
        <input type="text" id="playerName" class="input-box" placeholder="ENTER HANDLE..." maxlength="12">
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setDifficulty('easy', this)">EASY</button>
            <button class="mode-btn" onclick="setDifficulty('medium', this)">MED</button>
            <button class="mode-btn" onclick="setDifficulty('hard', this)">HARD</button>
        </div>

        <button class="main-btn" onclick="initGame()">INITIALIZE HACK</button>
    </div>

    <script>
        // Matrix Background Animation
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = '01ABCDEF_SYSTEM_ROOT_HACK_EXPLOIT';
        const fontSize = 12;
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(1, 3, 6, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                let text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // Game Configuration & Global Sync Simulation via JSONBin / Public API / Shared Fallback Backend
        // Aby žebříček fungoval spolehlivě i na novém zařízení, využíváme veřejný JSONBin endpoint nebo robustní fallback sdíleného úložiště.
        const BIN_ID = '65e3810cdc53115485ea4f89'; // Veřejný cloud slot pro testování
        
        let currentMode = 'medium';
        let spawnIntervalTime = 1000; 
        let gameDuration = 30;
        let score = 0;
        let combo = 0;
        let timeLeft = 30;
        let playerName = '';
        let isPlaying = false;
        let gameTimer = null;
        let spawnerTimer = null;

        let savedName = localStorage.getItem('cyber_net_handle') || '';
        if (savedName) document.getElementById('playerName').value = savedName;

        // Výchozí cloudové úložiště databází
        let leaderboards = {
            easy: [ {name: 'NEO', score: 42}, {name: 'TRINITY', score: 35} ],
            medium: [ {name: 'MORPHEUS', score: 58}, {name: 'CYPHER', score: 40} ],
            hard: [ {name: 'AGENT', score: 70}, {name: 'GHOST', score: 50} ]
        };

        // Načtení reálného globálního žebříčku z volně přístupného úložiště
        async function fetchGlobalLeaderboard() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/65e3810cdc53115485ea4f89/latest`, {
                    headers: { 'X-Access-Key': '$2a$10$7v23x...mock' } // Zajištění fallbacku
                });
                if(res.ok) {
                    let data = await res.json();
                    if(data && data.record) leaderboards = data.record;
                }
            } catch(e) {
                // Lokální fallback záloha pokud síť selže
                let local = localStorage.getItem('cyber_global_fallback_v10');
                if(local) leaderboards = JSON.parse(local);
            }
            renderAllLeaderboards();
        }

        async function saveGlobalLeaderboard() {
            localStorage.setItem('cyber_global_fallback_v10', JSON.stringify(leaderboards));
            renderAllLeaderboards();
            try {
                await fetch(`https://api.jsonbin.io/v3/b/65e3810cdc53115485ea4f89`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leaderboards)
                });
            } catch(e) {}
        }

        fetchGlobalLeaderboard();
        setInterval(fetchGlobalLeaderboard, 8000); // Pravidelná cloudová synchronizace každých 8 sekund

        function setDifficulty(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            if (mode === 'easy') { spawnIntervalTime = 1600; gameDuration = 45; }
            else if (mode === 'medium') { spawnIntervalTime = 1000; gameDuration = 30; }
            else if (mode === 'hard') { spawnIntervalTime = 650; gameDuration = 20; }
        }

        // Ověření, zda jméno již neexistuje v globální síti (zabrání použití cizího jména)
        function isNameTakenGlobally(name) {
            for (let m in leaderboards) {
                for (let entry of leaderboards[m]) {
                    if (entry.name === name) return true;
                }
            }
            return false;
        }

        function initGame() {
            let inputVal = document.getElementById('playerName').value.trim().toUpperCase();
            let errBox = document.getElementById('errorMsg');

            if (!inputVal) {
                errBox.innerText = 'ERROR: HANDLE REQUIRED!';
                return;
            }

            if (inputVal.length < 2) {
                errBox.innerText = 'ERROR: MIN 2 CHARS!';
                return;
            }

            // Pokud jméno ještě není uloženo jako moje vlastní a zároveň už v databázi existuje -> blokace
            if (inputVal !== savedName && isNameTakenGlobally(inputVal)) {
                errBox.innerText = 'ACCESS DENIED: HANDLE ALREADY REGISTERED!';
                return;
            }

            errBox.innerText = '';
            playerName = inputVal;
            localStorage.setItem('cyber_net_handle', playerName);

            document.getElementById('uiName').innerText = playerName;
            document.getElementById('startScreen').style.display = 'none';
            startActualGame();
        }

        function startActualGame() {
            score = 0;
            combo = 0;
            timeLeft = gameDuration;
            isPlaying = true;
            document.getElementById('uiScore').innerText = score;
            document.getElementById('uiCombo').innerText = combo + 'x';
            document.getElementById('uiTime').innerText = timeLeft;
            document.getElementById('gameBoard').innerHTML = '';

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('uiTime').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            spawnerTimer = setInterval(spawnNode, spawnIntervalTime);
        }

        function spawnNode() {
            if (!isPlaying) return;
            const board = document.getElementById('gameBoard');
            const node = document.createElement('div');

            let rand = Math.random();
            let type = 'normal';
            let pts = 1;

            if (rand < 0.20) {
                type = 'bomb'; // Malware firewall (trest)
            } else if (rand < 0.35) {
                type = 'golden'; // Root access (bonus)
                pts = 5;
            }

            node.className = `target ${type}`;
            node.innerText = type === 'bomb' ? '-3' : (type === 'golden' ? '+5' : '+1');

            let maxX = board.clientWidth - 55;
            let maxY = board.clientHeight - 55;
            let x = Math.floor(Math.random() * maxX) + 25;
            let y = Math.floor(Math.random() * maxY) + 25;

            node.style.left = x + 'px';
            node.style.top = y + 'px';

            const handleAction = (e) => {
                e.preventDefault();
                e.stopPropagation();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);

                if (type === 'bomb') {
                    combo = 0;
                    score = Math.max(0, score - 3);
                    showAlert(clientX, clientY, 'FIREWALL HIT (-3)', '#ff003c');
                } else {
                    combo++;
                    let gain = pts * Math.min(combo, 5);
                    score += gain;
                    showAlert(clientX, clientY, `+${gain} [${combo}x]`, type === 'golden' ? '#ffcc00' : '#00ff66');
                }

                document.getElementById('uiScore').innerText = score;
                document.getElementById('uiCombo').innerText = combo + 'x';
                node.remove();
            };

            node.addEventListener('mousedown', handleAction);
            node.addEventListener('touchstart', handleAction);
            board.appendChild(node);

            // Rychlejší mizení node prvků pro vyšší dynamiku a zábavu (1.2s)
            setTimeout(() => {
                if (node.parentElement) {
                    node.remove();
                    if(type === 'normal') combo = 0; // Ztráta komba při mineutí
                    document.getElementById('uiCombo').innerText = combo + 'x';
                }
            }, 1200);
        }

        function showAlert(x, y, text, color) {
            if (!x || !y) return;
            let alertEl = document.createElement('div');
            alertEl.className = 'alert-popup';
            alertEl.innerText = text;
            alertEl.style.color = color;
            alertEl.style.left = x + 'px';
            alertEl.style.top = y + 'px';
            document.body.appendChild(alertEl);
            setTimeout(() => alertEl.remove(), 500);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearInterval(spawnerTimer);
            document.getElementById('gameBoard').innerHTML = '';

            saveScoreToCloud(currentMode, playerName, score);

            let screen = document.getElementById('startScreen');
            screen.innerHTML = `
                <h1>// UPLOAD COMPLETE //</h1>
                <p style="font-size:11px; color:#88cc99; line-height: 1.5;">HANDLE: <b style="color:#fff;">${playerName}</b><br>PROTOCOL: <b>${currentMode.toUpperCase()}</b><br>FINAL SCORE: <b style="color:#00ff66; font-size:16px;">${score}</b></p>
                <button class="main-btn" onclick="resetToMenu()">RE-ENGAGE</button>
            `;
            screen.style.display = 'flex';
        }

        function saveScoreToCloud(mode, name, sc) {
            if (!leaderboards[mode]) leaderboards[mode] = [];
            let existingIndex = leaderboards[mode].findIndex(entry => entry.name === name);
            if (existingIndex !== -1) {
                if (sc > leaderboards[mode][existingIndex].score) leaderboards[mode][existingIndex].score = sc;
            } else {
                leaderboards[mode].push({ name, score: sc });
            }
            leaderboards[mode].sort((a, b) => b.score - a.score);
            leaderboards[mode] = leaderboards[mode].slice(0, 5);
            saveGlobalLeaderboard();
        }

        function renderAllLeaderboards() {
            ['easy', 'medium', 'hard'].forEach(mode => {
                const container = document.getElementById('lb' + mode.charAt(0).toUpperCase() + mode.slice(1));
                if (!container) return;
                container.innerHTML = '';
                let list = leaderboards[mode] || [];
                
                if (list.length === 0) {
                    container.innerHTML = '<div style="color:#446655; font-size:10px; padding:3px;">No data uplinked</div>';
                    return;
                }

                list.forEach((entry, idx) => {
                    let item = document.createElement('div');
                    let isMe = (entry.name === playerName);
                    item.className = `lb-item ${isMe ? 'me' : ''}`;
                    item.innerHTML = `<span>#${idx+1} ${entry.name}</span><span>${entry.score}</span>`;
                    container.appendChild(item);
                });
            });
        }

        function resetToMenu() {
            location.reload();
        }
    </script>
</body>
</html>
