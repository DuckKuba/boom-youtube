<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030308;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
        }
        .bg-space {
            position: absolute;
            width: 140%;
            height: 140%;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .cyber-card {
            position: relative;
            z-index: 10;
            background: rgba(12, 12, 20, 0.88);
            border: 3px solid #ff0055;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 45px rgba(255, 0, 85, 0.6);
            width: 520px;
            max-width: 90vw;
        }
        .header-title {
            font-size: 16px;
            letter-spacing: 3px;
            color: #ff3366;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #launchBtn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055 0%, #660022 100%);
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            border: 4px solid #ff6699;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
        }
        #launchBtn:hover { transform: scale(1.05); }
        .url-section {
            width: 100%;
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }
        .url-input {
            width: 100%;
            background: #000;
            border: 1px solid #ff0055;
            border-radius: 5px;
            color: #00ff88;
            font-size: 12px;
            padding: 8px;
            outline: none;
            margin-top: 5px;
        }
        .status-bar { margin-top: 15px; font-size: 12px; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <div class="bg-space"></div>

    <div class="cyber-card">
        <div class="header-title">// BOOM LAUNCHER PC //</div>

        <button id="launchBtn" onclick="launchScript()">BOOM</button>

        <div class="url-section">
            <span style="font-size:10px; color:#aaa;">TARGET GIST SCRIPT URL:</span>
            <input type="text" id="scriptUrl" class="url-input" value="https://gist.githubusercontent.com/DuckKuba/127740b1b9f9f3fdb924b98a90a431e1/raw/62401b0baa3d1b2722c6d2981554f18207784843/duckbrowser.js">
        </div>

        <div class="status-bar" id="statusText">SYSTEM READY</div>
    </div>

    <script>
        function launchScript() {
            let url = document.getElementById('scriptUrl').value.trim();
            let status = document.getElementById('statusText');

            status.innerText = 'LOADING SCRIPT...';
            status.style.color = '#ffcc00';

            try {
                let s = document.createElement('script');
                s.src = url;
                s.onload = () => {
                    status.innerText = 'SUCCESSFULLY EXECUTED!';
                    status.style.color = '#00ff88';
                };
                s.onerror = () => {
                    status.innerText = 'ERROR: FAILED TO LOAD (CORS/BLOCKED)';
                    status.style.color = '#ff0055';
                };
                document.head.appendChild(s);
            } catch(e) {
                status.innerText = 'ERROR: ' + e.message;
                status.style.color = '#ff0055';
            }
        }
    </script>
</body>
</html>
