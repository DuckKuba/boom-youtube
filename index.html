<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SLASHER: Neon Reflex</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030308;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }
        .bg-space {
            position: absolute;
            width: 140%;
            height: 140%;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: brightness(0.5) contrast(1.3);
        }
        .game-container {
            position: relative;
            z-index: 10;
            background: rgba(12, 12, 20, 0.9);
            border: 3px solid #ff0055;
            border-radius: 20px;
            width: 500px;
            max-width: 95vw;
            height: 450px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.5);
            overflow: hidden;
        }
        .game-header {
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .stat-item span { color: #00ff88; }
        .game-board {
            position: relative;
            flex: 1;
            cursor: crosshair;
            background: radial-gradient(circle, rgba(20,10,30,0.8) 0%, rgba(3,3,8,0.95) 100%);
        }
        .target {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #0055ff 100%);
            border: 2px solid #fff;
            box-shadow: 0 0 15px #00ffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            animation: popIn 0.2s ease-out;
            transform: translate(-50%, -50%);
        }
        .target.bonus {
            background: radial-gradient(circle, #ff0055 0%, #660022 100%);
            box-shadow: 0 0 20px #ff0055;
            color: #fff;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.92);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 22px; color: #ff3366; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,0,85,0.6); }
        p { font-size: 12px; color: #aaa; max-width: 300px; line-height: 1.4; }
        .start-btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
            transition: 0.2s;
        }
        .start-btn:hover { background: #ff3366; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="bg-space"></div>

    <div class="game-container">
        <div class="game-header">
            <div class="stat-item">SCORE: <span id="scoreVal">0</span></div>
            <div class="stat-item">TIME: <span id="timeVal">30</span>s</div>
            <div class="stat-item">HIGH: <span id="highVal">0</span></div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="overlay-screen" id="startScreen">
            <h1>// CYBER SLASHER //</h1>
            <p>Click as many neon targets as possible before the timer hits zero. Watch out for pink bonus targets!</p>
            <button class="start-btn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let spawnerInterval = null;
        let isPlaying = false;
        let highScore = localStorage.getItem('cyber_high') || 0;

        document.getElementById('highVal').innerText = highScore;

        function startGame() {
            score = 0;
            timeLeft = 30;
            isPlaying = true;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('timeVal').innerText = timeLeft;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameBoard').innerHTML = '';

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timeVal').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnerInterval = setInterval(spawnTarget, 650);
        }

        function spawnTarget() {
            if (!isPlaying) return;
            const board = document.getElementById('gameBoard');
            const target = document.createElement('div');
            
            let isBonus = Math.random() < 0.25;
            target.className = `target ${isBonus ? 'bonus' : ''}`;
            target.innerText = isBonus ? '2x' : '';

            // Náhodná pozice uvnitř hrací plochy s okrajem
            let maxX = board.clientWidth - 50;
            let maxY = board.clientHeight - 50;
            let x = Math.floor(Math.random() * maxX) + 25;
            let y = Math.floor(Math.random() * maxY) + 25;

            target.style.left = x + 'px';
            target.style.top = y + 'px';

            target.onmousedown = (e) => {
                e.stopPropagation();
                score += isBonus ? 3 : 1;
                document.getElementById('scoreVal').innerText = score;
                createEffect(e.clientX, e.clientY, isBonus ? '+3' : '+1');
                target.remove();
            };

            board.appendChild(target);

            // Cizí cíl po chvíli zmizí
            setTimeout(() => {
                if (target.parentElement) target.remove();
            }, 900);
        }

        function createEffect(x, y, text) {
            let eff = document.createElement('div');
            eff.innerText = text;
            eff.style.cssText = `position:fixed; left:${x}px; top:${y}px; color:#00ff88; font-weight:bold; font-size:14px; pointer-events:none; z-index:99; transition:0.5s ease-out; transform:translate(-50%, -50%);`;
            document.body.appendChild(eff);
            setTimeout(() => {
                eff.style.top = (y - 30) + 'px';
                eff.style.opacity = '0';
            }, 10);
            setTimeout(() => eff.remove(), 500);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnerInterval);
            document.getElementById('gameBoard').innerHTML = '';

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyber_high', highScore);
                document.getElementById('highVal').innerText = highScore;
            }

            let screen = document.getElementById('startScreen');
            screen.innerHTML = `
                <h1>// TIME UP //</h1>
                <p>Final Score: <b>${score}</b><br>High Score: <b>${highScore}</b></p>
                <button class="start-btn" onclick="startGame()">PLAY AGAIN</button>
            `;
            screen.style.display = 'flex';
        }
    </script>
</body>
</html>
