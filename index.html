<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM YouTube - Rocket Launch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', 'Courier New', monospace, sans-serif;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
            position: relative;
        }

        /* Animated Grid & Cyber Background */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 55, 0.25), transparent 60%),
                linear-gradient(rgba(255, 0, 55, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 55, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(0.5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.4) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        /* Card Container */
        .cyber-card {
            position: relative;
            z-index: 5;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(255, 0, 55, 0.4);
            border-radius: 16px;
            padding: 22px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 0, 55, 0.25), inset 0 0 15px rgba(255, 0, 55, 0.1);
            backdrop-filter: blur(10px);
            width: 330px;
            height: 280px;
            justify-content: space-between;
        }

        .header-title {
            font-size: 11px;
            letter-spacing: 3px;
            color: #ff3366;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 55, 0.8);
        }

        /* Button & Stage Arena */
        .stage-area {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cyber Button */
        #button1 {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0037 0%, #80001a 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            border: 3px solid #ff6688;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 55, 0.8);
            transition: transform 0.2s, background 0.2s;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #button1:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 0, 55, 1);
        }

        /* Rocket Launch Animation */
        .launch-rocket {
            animation: rocketFly 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        @keyframes rocketFly {
            0% { transform: translateY(0) scale(1.1); }
            30% { transform: translateY(20px) scale(0.9); }
            100% { transform: translateY(-400px) scale(0.5); opacity: 0; }
        }

        /* Parachute Drop YouTube Logo */
        #ytLogo {
            position: absolute;
            top: -200px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .parachute-drop {
            display: flex !important;
            animation: parachuteFall 1.2s ease-out forwards;
        }

        @keyframes parachuteFall {
            0% { top: -150px; transform: scale(0.6) rotate(-5deg); }
            60% { transform: rotate(5deg); }
            100% { top: 20px; transform: scale(1) rotate(0deg); }
        }

        .parachute-icon {
            font-size: 32px;
            margin-bottom: -10px;
        }

        .yt-icon {
            width: 65px;
            height: 45px;
            background: #ff0000;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
        }

        .yt-play {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 18px solid #ffffff;
            margin-left: 3px;
        }

        /* HUD & Status */
        .hud-stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
            font-size: 9px;
            color: #aaa;
        }

        .stat-value { color: #ff3366; font-weight: bold; font-size: 11px; }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 55, 0.3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        .status-text { font-size: 10px; font-weight: bold; color: #00ff88; letter-spacing: 1px; }

        .sound-toggle { position: absolute; top: 10px; right: 12px; cursor: pointer; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanline"></div>

    <div class="cyber-card" id="card">
        <div class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</div>
        <div class="header-title">// QUANTUM LAUNCHER //</div>

        <div class="stage-area">
            <button id="button1" onclick="spustBoom()">
                <span style="font-size:20px;">▶</span>
                <span>BOOM</span>
            </button>

            <!-- YouTube Parachute Element -->
            <div id="ytLogo">
                <span class="parachute-icon">🪂</span>
                <div class="yt-icon"><div class="yt-play"></div></div>
            </div>
        </div>

        <div class="hud-stats">
            <div>LAUNCHES: <span class="stat-value" id="launchCount">0</span></div>
            <div>TARGET: <span class="stat-value">YOUTUBE.COM</span></div>
        </div>

        <div class="status-container">
            <div class="status-dot" id="dot"></div>
            <div class="status-text" id="statusText">SYSTEM READY</div>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        let launches = parseInt(localStorage.getItem('boom_launches') || '0');
        document.getElementById('launchCount').innerText = launches;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Realistic Rocket Launch Sound (Thrust + Explosion)
        function playRocketSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                // 1. White Noise Generator for Rocket Thrust
                const bufferSize = ctx.sampleRate * 1.5;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, ctx.currentTime + 1.2);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                // 2. Sub-bass Explosion Pulse
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.8);

                oscGain.gain.setValueAtTime(0.6, ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);

                osc.connect(oscGain);
                oscGain.connect(ctx.destination);

                noise.start();
                osc.start();
            } catch(e) {}
        }

        async function spustBoom() {
            const btn = document.getElementById('button1');
            const ytLogo = document.getElementById('ytLogo');
            const statusText = document.getElementById('statusText');
            const dot = document.getElementById('dot');
            const body = document.body;

            launches++;
            localStorage.setItem('boom_launches', launches);
            document.getElementById('launchCount').innerText = launches;

            playRocketSound();

            // Phase 1: Ignition & Shake
            btn.innerHTML = '<span style="font-size:24px;">🚀</span><span>LAUNCH</span>';
            statusText.innerText = 'IGNITION...';
            statusText.style.color = '#ff0037';
            dot.style.backgroundColor = '#ff0037';

            for (let i = 0; i < 20; i++) {
                const x = (Math.random() - 0.5) * 25;
                const y = (Math.random() - 0.5) * 25;
                body.style.transform = `translate(${x}px, ${y}px)`;
                await new Promise(r => setTimeout(r, 15));
            }
            body.style.transform = 'none';

            // Phase 2: Rocket Fly Away
            btn.classList.add('launch-rocket');
            statusText.innerText = 'ROCKET DEPLOYED!';

            await new Promise(r => setTimeout(r, 400));

            // Phase 3: Parachute YouTube Drops Down
            ytLogo.classList.add('parachute-drop');
            statusText.innerText = 'LANDING YOUTUBE...';
            statusText.style.color = '#ffcc00';
            dot.style.backgroundColor = '#ffcc00';

            await new Promise(r => setTimeout(r, 1200));

            // Launch Target Window & Close Popup
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = 'https://www.youtube.com';
            } else {
                window.open('https://www.youtube.com', '_blank');
            }
            window.close();
        }
    </script>
</body>
</html>
