<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM YouTube - Quantum Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', 'Courier New', monospace, sans-serif;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
            position: relative;
        }

        /* Animated Grid & Cyber Background */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 55, 0.25), transparent 60%),
                linear-gradient(rgba(255, 0, 55, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 55, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(0.5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* Scanline CRT overlay */
        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.4) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        /* Main Container Card */
        .cyber-card {
            position: relative;
            z-index: 5;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(255, 0, 55, 0.4);
            border-radius: 16px;
            padding: 22px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 0, 55, 0.25), inset 0 0 15px rgba(255, 0, 55, 0.1);
            backdrop-filter: blur(10px);
            width: 320px;
        }

        .header-title {
            font-size: 11px;
            letter-spacing: 3px;
            color: #ff3366;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 55, 0.8);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title::before, .header-title::after {
            content: "//";
            color: #888;
        }

        /* Button Container */
        .button-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        /* Dual Rotating Energy Rings */
        .ring-1, .ring-2 {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            border: 2px dashed rgba(255, 0, 55, 0.6);
        }

        .ring-1 {
            width: 140px;
            height: 140px;
            animation: rotateClockwise 8s linear infinite;
        }

        .ring-2 {
            width: 160px;
            height: 160px;
            border-color: rgba(255, 200, 0, 0.4);
            animation: rotateCounter 12s linear infinite;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Cyberpunk Hyper Button */
        #button1 {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0037 0%, #80001a 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 3px solid #ff6688;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 30px rgba(255, 0, 55, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
        }

        #button1:hover {
            transform: scale(1.1);
            background: radial-gradient(circle, #ff2a55 0%, #a30021 100%);
            box-shadow: 0 0 50px rgba(255, 0, 55, 1), inset 0 0 25px rgba(255, 255, 255, 0.8);
            border-color: #ffffff;
        }

        #button1:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 55, 0.9);
        }

        .btn-icon {
            font-size: 22px;
            filter: drop-shadow(0 0 4px #fff);
        }

        .btn-text {
            font-size: 11px;
            font-weight: 800;
        }

        /* HUD Stats */
        .hud-stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 9px;
            color: #aaa;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            color: #ff3366;
            font-weight: bold;
            font-size: 11px;
            margin-top: 2px;
        }

        /* Status Bar */
        .status-container {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 55, 0.3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .status-text {
            font-size: 10px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 1px;
        }

        /* Sound Toggle Switch */
        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            z-index: 20;
        }
        .sound-toggle:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanline"></div>

    <div class="cyber-card" id="card">
        <div class="sound-toggle" id="soundBtn" onclick="toggleSound()" title="Toggle Sound">🔊</div>
        
        <div class="header-title">QUANTUM LAUNCHER v2.0</div>

        <div class="button-wrapper">
            <div class="ring-1"></div>
            <div class="ring-2"></div>
            <button id="button1" onclick="spustBoom()">
                <span class="btn-icon">▶</span>
                <span class="btn-text">BOOM</span>
            </button>
        </div>

        <div class="hud-stats">
            <div class="stat-box">
                <span>TOTAL LAUNCHES</span>
                <span class="stat-value" id="launchCount">0</span>
            </div>
            <div class="stat-box">
                <span>TARGET</span>
                <span class="stat-value">YOUTUBE.COM</span>
            </div>
        </div>

        <div class="status-container">
            <div class="status-dot" id="dot"></div>
            <div class="status-text" id="statusText">SYSTEM READY</div>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        let launches = parseInt(localStorage.getItem('boom_launches') || '0');
        document.getElementById('launchCount').innerText = launches;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Web Audio API Synthesizer (Cyber Launch SFX)
        function playLaunchSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.45);
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.45);
            } catch(e) {}
        }

        async function spustBoom() {
            const btn = document.getElementById('button1');
            const statusText = document.getElementById('statusText');
            const dot = document.getElementById('dot');
            const body = document.body;
            const card = document.getElementById('card');

            launches++;
            localStorage.setItem('boom_launches', launches);
            document.getElementById('launchCount').innerText = launches;

            playLaunchSound();

            body.style.backgroundColor = '#ffffff';
            card.style.boxShadow = '0 0 90px #ff0037';
            btn.style.transform = 'scale(1.25)';
            btn.style.background = '#ff0037';
            btn.innerHTML = '<span class="btn-icon">💥</span><span class="btn-text">BOOM!</span>';
            
            statusText.innerText = 'OVERDRIVE ACTIVE';
            statusText.style.color = '#ff0037';
            dot.style.backgroundColor = '#ff0037';
            dot.style.boxShadow = '0 0 12px #ff0037';

            for (let i = 0; i < 25; i++) {
                const x = (Math.random() - 0.5) * 35;
                const y = (Math.random() - 0.5) * 35;
                body.style.transform = `translate(${x}px, ${y}px)`;
                await new Promise(r => setTimeout(r, 15));
            }

            body.style.transform = 'none';
            body.style.backgroundColor = '#050508';
            btn.innerHTML = '<span class="btn-icon">⏳</span><span class="btn-text">WARP</span>';
            statusText.innerText = 'LAUNCHING YOUTUBE...';

            await new Promise(r => setTimeout(r, 200));

            if (window.opener && !window.opener.closed) {
                window.opener.location.href = 'https://www.youtube.com';
            } else {
                window.open('https://www.youtube.com', '_blank');
            }
            window.close();
        }
    </script>
</body>
</html>
