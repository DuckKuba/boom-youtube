<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #030308;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
        }

        .bg-space {
            position: absolute;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.25) 0%, transparent 50%),
                        linear-gradient(rgba(255, 0, 85, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 0, 85, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            z-index: 1;
        }

        .cyber-card {
            position: relative;
            z-index: 5;
            background: rgba(12, 12, 20, 0.95);
            border: 2px solid #ff0055;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.4);
            width: 330px;
        }

        .header-title {
            font-size: 12px;
            letter-spacing: 2px;
            color: #ff3366;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Audio Controls Bar */
        .audio-controls {
            position: absolute;
            top: 12px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 85, 0.3);
            z-index: 10;
        }

        .mute-btn {
            cursor: pointer;
            font-size: 11px;
            background: none;
            border: none;
            color: #fff;
            outline: none;
        }

        .volume-slider {
            width: 50px;
            height: 3px;
            accent-color: #ff0055;
            cursor: pointer;
        }

        .stage-area {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #launchBtn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055 0%, #660022 100%);
            color: #fff;
            font-weight: 900;
            border: 3px solid #ff6699;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
            z-index: 2;
        }

        #launchBtn:hover { transform: scale(1.05); }

        #rocketElement {
            position: absolute;
            font-size: 50px;
            display: none;
            z-index: 10;
        }

        .rocket-launch {
            display: block !important;
            animation: flyUp 1.8s ease-in forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            20% { transform: translateY(10px) scale(1.1); }
            100% { transform: translateY(-500px) scale(0.4); opacity: 0; }
        }

        #parachuteBadge {
            position: absolute;
            top: -200px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 8;
        }

        .parachute-drop {
            display: flex !important;
            animation: dropDown 1.2s ease-out forwards;
        }

        @keyframes dropDown {
            0% { top: -150px; transform: scale(0.5); }
            100% { top: 10px; transform: scale(1); }
        }

        .logo-box {
            width: 50px; height: 50px;
            background: #111;
            border: 2px solid #ff3366;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #ff0055;
        }

        .logo-box img { width: 30px; height: 30px; object-fit: contain; }

        .url-section {
            width: 100%;
            margin-top: 15px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        .url-label {
            font-size: 9px;
            color: #aaa;
            margin-bottom: 4px;
            display: block;
        }

        .url-box {
            display: flex;
            gap: 6px;
        }

        .url-input {
            flex: 1;
            background: #000;
            border: 1px solid #ff0055;
            border-radius: 4px;
            color: #00ff88;
            font-size: 11px;
            padding: 6px;
            outline: none;
        }

        .url-btn {
            background: #ff0055;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 10px;
            padding: 0 10px;
            cursor: pointer;
        }

        .status-bar {
            margin-top: 10px;
            font-size: 10px;
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-space"></div>

    <div class="cyber-card">
        <!-- Sound Controls -->
        <div class="audio-controls">
            <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="changeVolume(this.value)">
        </div>

        <div class="header-title">// LAUNCH CONTROL //</div>

        <div class="stage-area">
            <button id="launchBtn" onclick="launchSequence()">BOOM</button>
            <div id="rocketElement">🚀</div>

            <div id="parachuteBadge">
                <span style="font-size:24px;">🪂</span>
                <div class="logo-box">
                    <img id="targetFavicon" src="" alt="Target">
                </div>
            </div>
        </div>

        <div class="url-section">
            <span class="url-label">TARGET URL OR SCRIPT:</span>
            <div class="url-box">
                <input type="text" id="targetInput" class="url-input" placeholder="https://youtube.com">
                <button class="url-btn" onclick="saveUrl()">SAVE</button>
            </div>
        </div>

        <div class="status-bar" id="statusText">SYSTEM READY</div>
    </div>

    <script>
        let audioCtx = null;
        let isMuted = false;
        let masterVolume = 0.8;
        let lastVolume = 0.8;

        let currentUrl = localStorage.getItem('boom_url') || 'https://www.youtube.com';
        document.getElementById('targetInput').value = currentUrl;
        updateFavicon(currentUrl);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.body.addEventListener('click', initAudio, { once: true });

        function toggleMute() {
            const btn = document.getElementById('muteBtn');
            const slider = document.getElementById('volumeSlider');
            if (isMuted) {
                isMuted = false;
                masterVolume = lastVolume || 0.8;
                slider.value = masterVolume;
                btn.innerText = '🔊';
            } else {
                isMuted = true;
                lastVolume = masterVolume;
                masterVolume = 0;
                slider.value = 0;
                btn.innerText = '🔇';
            }
        }

        function changeVolume(val) {
            masterVolume = parseFloat(val);
            const btn = document.getElementById('muteBtn');
            if (masterVolume === 0) {
                isMuted = true;
                btn.innerText = '🔇';
            } else {
                isMuted = false;
                lastVolume = masterVolume;
                btn.innerText = '🔊';
            }
        }

        function playSound() {
            initAudio();
            if (!audioCtx || isMuted || masterVolume === 0) return;

            const bufferSize = audioCtx.sampleRate * 2.0;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 1.8);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function updateFavicon(url) {
            try {
                if (url.startsWith('javascript:')) {
                    document.getElementById('targetFavicon').src = 'https://www.google.com/s2/favicons?domain=javascript.info&sz=128';
                    return;
                }
                const domain = new URL(url).hostname;
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            } catch(e) {
                document.getElementById('targetFavicon').src = `https://www.google.com/s2/favicons?domain=youtube.com&sz=128`;
            }
        }

        function saveUrl() {
            let input = document.getElementById('targetInput').value.trim();
            if (input && !input.startsWith('http://') && !input.startsWith('https://') && !input.startsWith('javascript:')) {
                input = 'https://' + input;
            }
            currentUrl = input || 'https://www.youtube.com';
            localStorage.setItem('boom_url', currentUrl);
            document.getElementById('targetInput').value = currentUrl;
            updateFavicon(currentUrl);

            document.getElementById('statusText').innerText = 'SAVED SUCCESSFULLY!';
            setTimeout(() => { document.getElementById('statusText').innerText = 'SYSTEM READY'; }, 1500);
        }

        async function launchSequence() {
            playSound();
            const rocket = document.getElementById('rocketElement');
            const badge = document.getElementById('parachuteBadge');
            const status = document.getElementById('statusText');

            status.innerText = 'LAUNCHING ROCKET...';
            status.style.color = '#ff0055';

            rocket.classList.add('rocket-launch');
            await new Promise(r => setTimeout(r, 1600));

            status.innerText = 'LANDING AT TARGET...';
            status.style.color = '#ffcc00';
            badge.classList.add('parachute-drop');
            await new Promise(r => setTimeout(r, 1200));

            if (currentUrl.startsWith('javascript:')) {
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.eval(currentUrl.replace('javascript:', ''));
                    } catch(e) {
                        alert('JS Execution Error: ' + e.message);
                    }
                } else {
                    try {
                        eval(currentUrl.replace('javascript:', ''));
                    } catch(e) {
                        alert('JS Execution Error: ' + e.message);
                    }
                }
            } else {
                if (window.opener && !window.opener.closed) {
                    window.opener.location.href = currentUrl;
                } else {
                    window.open(currentUrl, '_blank');
                }
            }
            window.close();
        }
    </script>
</body>
</html>
